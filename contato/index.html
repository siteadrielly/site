<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato — Dra. Adriely Anute</title>
<meta name="description" content="Fale com a Dra. Adriely Anute — Harmonização Facial e Implantodontia em João Pessoa, PB.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Jost:wght@300;400&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#141210;
    --espresso:#221D17;
    --ivory:#F2ECE1;
    --gold:#BE9A5C;
    --gold-light:#E4CB9B;
    --gold-dim:#8C7444;
    --line-dark: rgba(228,203,155,0.28);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg, var(--espresso), var(--black));
    color:var(--ivory);
    font-family:'Jost', sans-serif;
    font-weight:300;
    line-height:1.6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
    -webkit-font-smoothing:antialiased;
  }
  .card{ max-width:560px; text-align:center; }
  .logo{
    font-family:'Bodoni Moda', serif;
    font-weight:500;
    font-size:1.05rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ivory);
    margin-bottom:2.4rem;
  }
  .logo span{ color:var(--gold); }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .gold-rule{ width:52px; height:1px; background:var(--gold); margin:1.2rem auto; }
  h1{
    font-family:'Bodoni Moda', serif;
    font-weight:500;
    line-height:1.2;
    padding-top:0.1em;
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    margin:0;
  }
  .sub{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold-light);
    font-size:1.2rem;
    margin-top:0.6rem;
  }
  p.desc{
    margin-top:1.4rem;
    color:rgba(242,236,225,0.75);
    font-size:0.98rem;
    max-width:42ch;
    margin-left:auto;
    margin-right:auto;
  }
  .ctas{ margin-top:2.4rem; display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
  .btn-gold, .btn-ghost{
    display:inline-flex; align-items:center; gap:0.5rem;
    padding:0.95rem 2rem;
    font-size:0.74rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    text-decoration:none;
    transition:all 0.25s ease;
  }
  .btn-gold{ background:var(--gold); color:var(--black); }
  .btn-gold:hover{ background:var(--gold-light); }
  .btn-ghost{ border:1px solid rgba(242,236,225,0.5); color:var(--ivory); }
  .btn-ghost:hover{ border-color:var(--gold); color:var(--gold-light); }
  .addr{
    margin-top:3rem;
    padding-top:2rem;
    border-top:1px solid var(--line-dark);
    font-size:0.85rem;
    color:rgba(242,236,225,0.6);
  }
  .addr strong{ display:block; color:var(--ivory); font-weight:400; margin-bottom:0.4rem; }
  .back-link{
    display:inline-block;
    margin-top:2.2rem;
    font-size:0.78rem;
    color:rgba(242,236,225,0.55);
    text-decoration:underline;
  }
  .back-link:hover{ color:var(--gold-light); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Adriely <span>Anute</span></div>
    <div class="eyebrow">Contato</div>
    <div class="gold-rule"></div>
    <h1>Vamos conversar?</h1>
    <p class="sub">Entre em contato usando o botão abaixo.</p>
    <p class="desc">Respondemos pelo WhatsApp o quanto antes.</p>
    <div class="ctas">
      <a href="https://wa.me/5583986821511" class="btn-gold">Chamar no WhatsApp</a>
      <a href="https://instagram.com/draadrielyanute" class="btn-ghost">@draadrielyanute</a>
    </div>
    <div class="addr">
      <strong>Av. Arthur Monteiro de Paiva, 721</strong>
      Bessa, João Pessoa, PB
    </div>
    <a class="back-link" href="/">← Voltar para o site</a>
  </div>
</body>
</html>
